<main class="login-shell">
  <section class="login-card">
    <div class="card-accent" aria-hidden="true"></div>

    <div class="brand-row">
      <span class="brand-mark"><span></span><span></span></span>
      <div class="eyebrow">Nuvexa Andina Digital</div>
    </div>
    <h1>ReqFlow</h1>
    <p class="subtitle">Inicia sesión para consultar tus requerimientos.</p>

    <label>
      Usuario
      <div class="field">
        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M4 20c1.4-3.6 4.6-5.5 8-5.5s6.6 1.9 8 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input [(ngModel)]="username" name="username" autocomplete="username" placeholder="student">
      </div>
    </label>

    <label>
      Contraseña
      <div class="field">
        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8 11V7.5a4 4 0 0 1 8 0V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input [(ngModel)]="password" name="password" type="password" autocomplete="current-password" placeholder="Workshop123!">
      </div>
    </label>

    <button type="button" (click)="login()" [disabled]="busy">
      <span *ngIf="busy" class="spinner" aria-hidden="true"></span>
      {{ busy ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <div class="message" *ngIf="message" [innerHTML]="message"></div>

    <small>Laboratorio local. No utilices credenciales reales.</small>
  </section>
</main>
